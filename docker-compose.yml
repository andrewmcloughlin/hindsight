services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    command: python hindsight/manage.py runserver 0.0.0.0:8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - WATCHPACK_POLLING=true
